<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個資法聲明</title><style>body{margin:0;padding:24px 20px 40px;font:16px/1.75 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;color:#1c1b1f}h1{color:#165fa8;font-size:25px}h2{margin-top:28px;font-size:19px}.note{padding:12px;background:#fff4ce;color:#704d00;border-radius:10px}</style></head><body><h1>個資法聲明</h1><p class="note">示範文字。正式發布前請由法務及資料保護負責人確認並替換。</p><h2>一、處理目的</h2><p>我們為登入驗證、提供企業功能、保障運行安全及履行法定或企業管理義務，處理必要的個人資料。</p><h2>二、資料範圍</h2><p>可能包括帳號、姓名、組織、角色、登入狀態、裝置與安全日誌，以及您在授權功能中處理的業務資料。</p><h2>三、保護與權利</h2><p>我們採取存取控制、加密傳輸和日誌稽核等合理措施。您可透過企業管理員或指定聯絡管道，查詢、更正或申請處理與您有關的資料。</p><h2>四、分享</h2><p>除必要授權、法定義務或提供企業服務所需外，不會向無關第三方分享個人資料。</p></body></html>

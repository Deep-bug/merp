<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个资法声明</title><style>body{margin:0;padding:24px 20px 40px;font:16px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1c1b1f}h1{color:#165fa8;font-size:25px}h2{margin-top:28px;font-size:19px}.note{padding:12px;background:#fff4ce;color:#704d00;border-radius:10px}</style></head><body><h1>个资法声明</h1><p class="note">演示文本。正式发布前请由法务与数据保护负责人确认并替换。</p><h2>一、处理目的</h2><p>我们为登录认证、提供企业功能、保障运行安全及履行法定或企业管理义务，处理必要的个人资料。</p><h2>二、资料范围</h2><p>可能包括账号、姓名、组织、角色、登录状态、设备与安全日志，以及您在授权功能中处理的业务资料。</p><h2>三、保护与权利</h2><p>我们采取访问控制、加密传输和日志审计等合理措施。您可通过企业管理员或指定联系渠道，咨询、更正或申请处理与您有关的资料。</p><h2>四、共享</h2><p>除必要授权、法定义务或提供企业服务所需外，不会向无关第三方共享个人资料。</p></body></html>
